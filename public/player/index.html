<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signage Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: monospace;
    }
    
    #media-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    video, img, #yt-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.5s;
      border: none;
      pointer-events: none;
    }
    
    .active {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* Iframe para sites e dashboards */
    #site-frame {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      border: none;
      z-index: 5;
      display: none;
      background: #000;
    }
    #site-frame.visible {
      display: block;
    }

    #status {
      z-index: 20;
      position: absolute;
      background: rgba(0,0,0,0.8);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1.25rem;
      border: 1px solid #333;
      pointer-events: none;
    }
    
    /* Menu de Salas */
    .room-menu {
      z-index: 30;
      background: #111;
      border: 1px solid #333;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
    }
    .room-menu h1 { margin-top: 0; font-size: 24px; margin-bottom: 20px; }
    .room-list { display: flex; flex-direction: column; gap: 12px; }
    .room-btn {
      background: #10b981;
      color: black;
      border: none;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .room-btn:hover { background: #34d399; }

    #remote-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid #333;
      padding: 10px 24px;
      border-radius: 50px;
      display: flex;
      gap: 24px;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }
    #remote-overlay.visible { opacity: 1; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    .control-divider { width: 1px; height: 28px; background: #333; }
    .group-icon { color: #666; display: flex; align-items: center; }
    .group-icon svg { width: 22px; height: 22px; }
    .remote-btn {
      background: none;
      border: none;
      color: #a3a3a3;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remote-btn:hover { background: rgba(255,255,255,0.15); color: white; }
    .remote-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .remote-btn.play-btn svg { fill: currentColor; }

    @media (max-width: 600px) {
      #remote-overlay {
        padding: 6px 14px;
        gap: 12px;
        bottom: 16px;
        max-width: 95vw;
        box-sizing: border-box;
      }
      .control-group {
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div id="status">Conectando...</div>
  <div id="media-container"></div>
  
  <!-- Frame do Site Remoto -->
  <iframe
    id="site-frame"
    allow="autoplay; fullscreen; encrypted-media; accelerometer; gyroscope; picture-in-picture"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
  ></iframe>

  <div id="remote-overlay">
    <!-- Visual / Site Controls -->
    <div class="control-group" id="visual-controls-group">
      <div class="group-icon" title="Visual Controls">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
      </div>
      <button class="remote-btn" id="btn-v-prev" title="Anterior">
        <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
      </button>
      <button class="remote-btn play-btn" id="btn-v-play" title="Play / Pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
      </button>
      <button class="remote-btn" id="btn-v-next" title="Próximo">
        <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
      </button>
      <button class="remote-btn" id="btn-site-reload" title="Recarregar Site" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </button>
    </div>

    <div class="control-divider"></div>

    <!-- Audio Controls -->
    <div class="control-group">
      <div class="group-icon" title="Audio Controls">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      </div>
      <button class="remote-btn" id="btn-a-prev" title="Anterior Áudio">
        <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
      </button>
      <button class="remote-btn play-btn" id="btn-a-play" title="Play / Pause Áudio">
        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
      </button>
      <button class="remote-btn" id="btn-a-next" title="Próximo Áudio">
        <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
      </button>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
