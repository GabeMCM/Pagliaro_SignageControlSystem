services:
  - type: web
    name: signage-control-system
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8001
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false # O Render solicitará que você insira sua senha/URI com segurança pelo painel
      - key: MONGODB_DB_NAME
        value: cap-signage
      - key: AUTH_SECRET
        generateValue: true # O Render gera automaticamente uma chave criptográfica forte
      - key: DROPBOX_APP_KEY
        value: 1occi7mbnags2z2
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_MUSIC_FOLDER
        value: "/Músicas"
